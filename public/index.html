<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <title>whatdaduck — a very unserious party game</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand" aria-label="whatdaduck home"
        ><svg viewBox="0 0 80 64" aria-hidden="true">
          <path
            d="M15 31c-9 27 44 38 55 9-14 8-24 0-24-9 0-7 9-7 9-17C55-1 30-2 28 15c-1 8 3 12-1 15Z"
            fill="#ffd23f"
            stroke="currentColor"
            stroke-width="3"
          />
          <path
            d="m53 13 15 7-15 5"
            fill="#fa754c"
            stroke="currentColor"
            stroke-width="3"
          />
          <circle cx="43" cy="12" r="3" /></svg
        ><span
          >whatda<span class="brand-end">duck</span
          ><small>THE INTERNET MADE ME DO IT</small></span
        ></a
      >
      <div class="header-right">
        <span id="connection" class="status"></span
        ><label class="sr" for="language">Language / Sprache</label
        ><select id="language">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
    </header>
    <main id="app"></main>
    <div id="toast" role="alert" hidden></div>
    <footer>
      whatdaduck <span>·</span>
      <span id="footer-text">Good friends. Terrible memes.</span>
    </footer>
  </body>
</html>
